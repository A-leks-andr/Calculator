name: CI (Code Quality and Tests)

# Настраиваем триггеры: запускать автоматику при каждом push или pull request
# в ветку master
on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test_and_lint:
    # Запускаем чистую виртуальную машину на базе Ubuntu Linux
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код репозитория на виртуальную машину
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Устанавливаем современный пакетный менеджер uv (Astral)
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      # 3. Устанавливаем Python
      - name: Set up Python
        run: uv python install 3.14

      # 4. Синхронизируем и устанавливаем все зависимости (flet, pytest, ruff)
      - name: Install dependencies
        run: uv sync

      # 5. Проверяем качество кода линтером Ruff
      - name: Run Ruff Linter
        run: make check

      # 6. Запускаем тесты и генерируем файл coverage.xml прямо на сервере
      - name: Run Pytest Tests with Coverage
        run: make cov

      # 7. Передаём сгенерированный coverage.xml в сканер SonarCloud
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}